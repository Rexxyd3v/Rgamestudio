name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat

      - name: Install dependencies
        run: |
          cd vcpkg
          .\vcpkg install raylib:x64-windows enet:x64-windows

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        run: |
          cd build
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/cmake.toolchain.cmake `
            ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/Release/RGameStudio.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxext-dev \
            libudev-dev

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh

      - name: Install dependencies
        run: |
          cd vcpkg
          ./vcpkg install raylib:x64-linux enet:x64-linux

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/cmake.toolchain.cmake \
            ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/RGameStudio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup vcpkg
        run: |
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.sh

      - name: Install dependencies
        run: |
          cd vcpkg
          ./vcpkg install raylib:arm64-osx enet:arm64-osx

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        run: |
          cd build
          cmake -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=../vcpkg/scripts/buildsystems/cmake.toolchain.cmake \
            ..

      - name: Build
        run: |
          cd build
          cmake --build . --config Release

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/RGameStudio
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

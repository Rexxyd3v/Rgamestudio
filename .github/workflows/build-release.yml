name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build/release (e.g. v3.0.0)"
        required: true
        type: string

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-raylib
            mingw-w64-ucrt-x86_64-enet
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-opusfile
            mingw-w64-ucrt-x86_64-libvorbis
            mingw-w64-ucrt-x86_64-miniaudio

      - name: Check dependencies
        shell: msys2 {0}
        run: |
          echo "=== GCC ==="
          g++ --version

          echo "=== Raylib ==="
          pkg-config --modversion raylib

          echo "=== ENet ==="
          pkg-config --modversion libenet || pkg-config --modversion enet

          echo "=== Opus ==="
          pkg-config --modversion opus

          echo "=== Miniaudio ==="
          pkg-config --modversion miniaudio || true

      - name: Build Rgamestudio
        shell: msys2 {0}
        run: |
          mkdir -p bin
          ENET_PC=libenet
          pkg-config --exists libenet || ENET_PC=enet

          g++ \
            src/*.cpp \
            src/screens/*.cpp \
            src/utils/*.cpp \
            src/map_loader/*.cpp \
            src/map_loader/scenes/*.cpp \
            src/entities/*.cpp \
            src/network/*.cpp \
            src/ui/*.cpp \
            src/voice/*.cpp \
            -std=c++17 \
            -O2 \
            -o bin/Rgamestudio.exe \
            -I. $(pkg-config --cflags raylib opus $ENET_PC miniaudio) \
            $(pkg-config --libs raylib opus $ENET_PC miniaudio) \
            -lws2_32 \
            -lwinmm \
            -lgdi32 \
            -lopengl32

      - name: Verify EXE
        shell: msys2 {0}
        run: |
          if [ ! -f bin/Rgamestudio.exe ]; then
            echo "ERROR: Rgamestudio.exe was not created."
            exit 1
          fi

          echo "Build successful!"
          ls -lh bin/Rgamestudio.exe

      - name: Prepare Release Package
        shell: msys2 {0}
        run: |
          rm -rf release_package
          mkdir -p release_package

          cp bin/Rgamestudio.exe release_package/

          if [ -d assets ]; then
            cp -r assets release_package/
          fi

          echo "Collecting required DLLs..."

          ldd bin/Rgamestudio.exe | awk '/\/ucrt64\/bin\// {print $3}' | sort -u | while read -r dll; do
            if [ -f "$dll" ]; then
              cp "$dll" release_package/
            fi
          done

          missing=0
          for dep in $(ldd bin/Rgamestudio.exe | awk '/\/ucrt64\/bin\// {print $1}'); do
            if [ ! -f "release_package/$dep" ]; then
              echo "ERROR: Missing runtime DLL in package: $dep"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Release package:"
          find release_package -maxdepth 2 -type f

      - name: Create Release ZIP
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $zip = "Rgamestudio-$tag-windows.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "release_package\*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          Write-Host "Created $zip"
          Get-Item $zip | Format-List Name,Length,FullName

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          name: "Rgamestudio ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}"
          body: |
            # Rgamestudio ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}

            ## Download

            Download the Windows ZIP below and extract it.

            ## How to Play

            1. Download `Rgamestudio-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}-windows.zip`
            2. Extract the ZIP.
            3. Open the extracted folder.
            4. Run `Rgamestudio.exe`.

            ## Requirements

            - Windows 10/11
            - 64-bit Windows
            - No manual library download required (all runtime DLLs are bundled)

          files: |
            Rgamestudio-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}-windows.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: true

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
